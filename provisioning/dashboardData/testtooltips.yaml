#------------------------------------------------------------------------------
# YAML Aliases to simplify maintenance

anchorLinks:
  - link: &grafana-home
      url: "https://grafana.com/"
      params: "time"
  - threshold_three_status: &threshold_three_status
        - {color: "green", level: 0}
        - color: "orange"
          level: 500
          blinkColor: "yellow"
        - color: "red"
          level: 800
          blinkColor: "white"

